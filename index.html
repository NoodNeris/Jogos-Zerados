<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Finalizados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">async function initApp
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Montserrat:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            /* Fundo da estante mais transparente para ver o vídeo através da madeira */
            --wood-dark: rgba(10, 7, 5, 0.4); 
            --wood-back: rgba(20, 13, 9, 0.6);
            --wood-floor: rgba(51, 32, 20, 0.8);
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --case-depth: 45px;
            --modal-dvd-depth: 60px;
            --led-color: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: #000;
        }

        /* === VÍDEO DE FUNDO (TELA CHEIA E FIXO) === */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3; /* Fica atrás de absolutamente tudo */
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Degradê para escurecer o rodapé da tela, facilitando a leitura dos jogos */
        .video-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(5,5,5,0.95) 100%);
            z-index: -2;
        }

        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
            overflow: hidden;
        }
        .bg-particles::after {
            content: ''; position: absolute; top: 0; left: 0; width: 200vw; height: 200vh;
            background-image: radial-gradient(var(--gold) 1px, transparent 1px);
            background-size: 80px 80px; opacity: 0.1;
            animation: floatBG 90s linear infinite;
        }
        @keyframes floatBG {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(-50vh) translateX(-50vw); }
        }

        /* === CABEÇALHO IMERSIVO ESTILO STEAM === */
        .hero-section {
            width: 100%;
            height: 65vh; /* Ocupa 65% da tela inicial */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Empurra o texto para baixo */
            align-items: flex-start; /* Alinha o texto na esquerda */
            padding: 50px 8vw; /* Espaçamento das bordas */
            z-index: 10;
        }

        /* O TÍTULO (Livre, sem caixa, com contorno preto) */
        .hero-title {
            font-family: 'Cinzel', serif; 
            font-size: clamp(3rem, 7vw, 6.5rem); 
            font-weight: 800;
            color: #fff; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            margin-bottom: 0;
            line-height: 1.1;
            /* CONTORNO PRETO ESTILO LOGO DE JOGO */
            -webkit-text-stroke: 2px #000; 
            text-shadow: 0px 15px 30px rgba(0,0,0,0.9);
            transition: transform 0.3s ease;
        }
        .hero-title:hover {
            transform: scale(1.02) translateX(10px);
        }
        
        .hero-subtitle {
            color: var(--gold); 
            font-family: 'Montserrat', sans-serif; 
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-style: italic; 
            letter-spacing: 4px; 
            font-weight: bold;
            margin-top: 5px;
            /* Contorno fino no subtítulo */
            -webkit-text-stroke: 1px #000;
            text-shadow: 0 5px 15px rgba(0,0,0,0.9);
        }

        /* === BARRA DE CONTROLES === */
        .controls-bar {
            width: 90%;
            max-width: 1500px;
            margin: 0 auto 40px auto;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(10px); /* Vidro fosco elegante */
            padding: 15px 30px; 
            display: flex; justify-content: center; gap: 20px; align-items: center;
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            flex-wrap: wrap;
            z-index: 10;
            position: relative;
        }
        .controls-bar label { font-family: 'Cinzel', serif; font-size: 1.1rem; color: #fff; }
        .controls-bar select {
            background: rgba(0,0,0,0.8); color: var(--gold); border: 1px solid var(--gold);
            padding: 8px 15px; font-family: 'Montserrat', sans-serif; font-weight: bold;
            border-radius: 4px; cursor: pointer; outline: none; transition: 0.3s;
        }
        .controls-bar select:hover { background: rgba(30,30,30,0.9); box-shadow: 0 0 15px var(--gold-glow); }

        .btn-action {
            background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #555;
            padding: 8px 15px; font-family: 'Montserrat', sans-serif; font-weight: bold;
            border-radius: 4px; cursor: pointer; outline: none; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-action:hover { background: rgba(30,30,30,0.9); border-color: var(--gold); }
        .btn-action.active {
            border-color: var(--led-color); color: var(--led-color); box-shadow: 0 0 15px var(--led-color);
            text-shadow: 0 0 5px var(--led-color);
        }

        #app-status { text-align: center; color: var(--gold); font-family: 'Cinzel'; font-size: 1.2rem; margin-bottom: 30px; text-shadow: 0 0 10px #000; padding: 0 20px; position: relative; z-index: 10;}

        /* A ESTANTE VOLUMÉTRICA */
        .library-container {
            width: 100%; max-width: 1500px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 0; padding: 0 20px 60px;
            border-left: clamp(10px, 3vw, 35px) solid rgba(15,10,5,0.8); 
            border-right: clamp(10px, 3vw, 35px) solid rgba(15,10,5,0.8); 
            border-top: clamp(10px, 3vw, 35px) solid rgba(15,10,5,0.8);
            box-shadow: 0 50px 100px rgba(0,0,0,0.9), inset 0 0 60px rgba(0,0,0,0.8);
            background: var(--wood-dark); 
            backdrop-filter: blur(8px); /* Deixa o vídeo visível, mas desfocado, atrás da estante */
            border-radius: 8px; display: none;
            z-index: 10;
            position: relative;
        }

        .shelf-row {
            position: relative; width: 100%; min-height: 400px;
            display: flex; justify-content: center; align-items: flex-end;
            padding-bottom: 25px; border-bottom: 45px solid rgba(28, 17, 9, 0.85);
            box-shadow: 0 25px 40px -10px rgba(0,0,0,0.9), inset 0 -60px 100px rgba(0,0,0,0.8);
            background: linear-gradient(to bottom, transparent, var(--wood-back));
            perspective: 1400px; z-index: 1; transition: box-shadow 0.4s;
        }

        .shelf-row::before {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 130px;
            background: linear-gradient(to top, var(--wood-floor), transparent);
            transform-origin: bottom; transform: rotateX(65deg);
            box-shadow: inset 0 30px 60px rgba(0,0,0,0.9); z-index: 0;
            border-top: 2px solid rgba(255,255,255,0.03); transition: box-shadow 0.4s;
        }

        .shelf-row.led-active { box-shadow: 0 25px 40px -10px rgba(0,0,0,0.9), inset 0 -60px 100px rgba(0,0,0,0.8), inset 0 25px 60px -20px var(--led-color); }
        .shelf-row.led-active::after {
            content: ''; position: absolute; top: -2px; left: 0; width: 100%; height: 6px;
            background: var(--led-color); box-shadow: 0 5px 30px 10px var(--led-color);
            opacity: 0.65; z-index: 5; pointer-events: none;
        }
        .shelf-row.led-active::before { box-shadow: inset 0 30px 60px rgba(0,0,0,0.9), inset 0 60px 80px -40px var(--led-color); }

        .shelf-content {
            display: flex; gap: 45px; position: relative; z-index: 10;
            transform-style: preserve-3d; padding: 0 40px; flex-wrap: nowrap; justify-content: center;
        }

        .game-case-wrapper { width: 190px; height: 270px; perspective: 1200px; cursor: pointer; position: relative; margin-top: 30px; }
        .game-case-animator { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
        .case-shadow {
            position: absolute; bottom: -15px; left: -20px; width: 140%; height: 40px;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.9) 0%, transparent 70%);
            transform: rotateX(70deg) translateZ(-20px); z-index: -1; transition: 0.4s ease; opacity: 0.8;
        }
        .game-case-wrapper:hover .case-shadow { transform: rotateX(70deg) translateZ(-20px) scale(1.1) translateX(10px); opacity: 1; }

        .game-case {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1); transform-origin: center center; z-index: 2;
        }
        .game-case-wrapper:hover .game-case { transform: rotateY(35deg) translateZ(30px) translateY(-10px); }

        .case-face { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 3px 8px 8px 3px; }
        .case-front { transform: translateZ(calc(var(--case-depth) / 2)); background: #000; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15), inset 2px 0 5px rgba(255,255,255,0.1); transition: box-shadow 0.4s; }
        .case-front img { width: 100%; height: 100%; object-fit: cover; }
        .case-front::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 100%; height: 100%;
            background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.5) 40%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.2) 60%, transparent 80%);
            transition: left 0.7s ease; mix-blend-mode: overlay; pointer-events: none;
        }
        .game-case-wrapper:hover .case-front::after { left: 150%; }

        .case-side { width: var(--case-depth); height: 100%; transform: rotateY(-90deg) translateZ(calc(var(--case-depth) / 2)); background-color: #111; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), inset -5px 0 15px rgba(0,0,0,0.8); transition: box-shadow 0.4s; }
        .case-top { width: 100%; height: var(--case-depth); background: #1a1a1a; transform: rotateX(90deg) translateZ(calc(var(--case-depth) / 2)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }

        .game-reflection {
            position: absolute; top: 100%; left: 0; width: 100%; height: 100%; transform-origin: top;
            transform: rotateX(180deg) translateZ(calc(var(--case-depth) / 2));
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 40%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 40%);
            opacity: 0.6; pointer-events: none; border-radius: 3px 8px 8px 3px;
        }
        .game-reflection img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px 8px 8px 3px; }

        .platform-badge {
            position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 5, 2, 0.85); border: 1px solid rgba(212, 175, 55, 0.3);
            color: #aaa; font-size: 0.65rem; padding: 3px 12px; border-radius: 12px; font-weight: bold; z-index: 5;
            text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); 
            white-space: nowrap; transition: 0.3s ease; pointer-events: none;
        }
        .game-case-wrapper:hover .platform-badge { color: var(--gold); border-color: var(--gold); background: rgba(10, 5, 2, 1); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3); }

        .masterpiece .game-case-animator { animation: floatMasterpiece 4s ease-in-out infinite; }
        @keyframes floatMasterpiece { 0%, 100% { transform: translateY(-5px); } 50% { transform: translateY(-18px); } }
        .masterpiece:hover .game-case { transform: scale(1.05) rotateY(35deg) translateZ(40px); }
        .masterpiece .case-front { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), inset 2px 0 5px rgba(255,255,255,0.1), 0 0 15px rgba(212, 175, 55, 0.5); }
        .masterpiece .case-side { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2), inset -5px 0 15px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.5); }
        .masterpiece:hover .case-front, .masterpiece:hover .case-side { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), 0 0 40px rgba(212, 175, 55, 0.9); }
        .masterpiece .case-shadow { background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.6) 0%, transparent 70%); animation: shadowPulse 4s ease-in-out infinite; }
        @keyframes shadowPulse { 0%, 100% { transform: rotateX(70deg) translateZ(-20px) scale(1.1); opacity: 0.8; } 50% { transform: rotateX(70deg) translateZ(-20px) scale(0.9); opacity: 0.5; } }
        .masterpiece:hover .case-shadow { background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.9) 0%, transparent 70%); }
        .masterpiece .platform-badge { background: linear-gradient(135deg, #1a1400, #403000); border: 1px solid var(--gold); color: var(--gold); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.6); }
        .masterpiece .platform-badge::before { content: '👑 '; }
        
        .sparkle {
            position: absolute; bottom: 0; width: 4px; height: 4px; background: var(--gold); border-radius: 50%;
            box-shadow: 0 0 10px var(--gold); opacity: 0; pointer-events: none;
            animation: floatUp 3s infinite linear;
        }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-150px) scale(0); opacity: 0; } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.5s ease; z-index: 1000; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: linear-gradient(145deg, #1f1f1f, #0a0a0a); width: 1100px; max-width: 95%; height: 600px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 0 150px rgba(0,0,0,1), inset 0 0 50px rgba(0,0,0,0.8); display: flex; position: relative; transform: scale(0.9) translateY(30px); opacity: 0; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }
        .modal-masterpiece .modal-content { border: 2px solid var(--gold); box-shadow: 0 0 120px rgba(212, 175, 55, 0.3), inset 0 0 60px rgba(212, 175, 55, 0.1); }

        .wax-seal { position: absolute; top: 35px; right: 35px; width: 140px; height: 140px; background: radial-gradient(circle at 35% 35%, #e63946, #b00000, #5c0000); border-radius: 50%; display: flex; justify-content: center; align-items: center; text-align: center; color: #ffe8e0; font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 800; line-height: 1.1; transform: rotate(-15deg) scale(0); z-index: 50; letter-spacing: 1px; box-shadow: inset 0 0 15px rgba(50,0,0,0.9), inset 0 0 0 5px rgba(255,100,100,0.3), 0 15px 30px rgba(0,0,0,0.8); border: 2px solid #540000; text-shadow: 1px 2px 3px rgba(0,0,0,0.9); transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s, background 0.4s, box-shadow 0.4s; }
        .modal-overlay.active .wax-seal { transform: rotate(-15deg) scale(1); }
        .wax-seal::before { content: ''; position: absolute; width: 112%; height: 112%; border-radius: 40% 60% 55% 45% / 55% 45% 60% 40%; background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(130,0,0,0.8) 100%); border: 2px solid rgba(80,0,0,0.5); filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5)); transition: background 0.4s, border-color 0.4s; }
        .modal-masterpiece .wax-seal { background: radial-gradient(circle at 35% 35%, #ffdf00, #d4af37, #8b6508); color: #fff; border-color: #d4af37; box-shadow: inset 0 0 20px rgba(139, 101, 8, 0.9), inset 0 0 0 5px rgba(255, 223, 0, 0.5), 0 20px 40px rgba(212, 175, 55, 0.7); }
        .modal-masterpiece .wax-seal::before { background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(139, 101, 8, 0.8) 100%); border-color: rgba(212, 175, 55, 0.9); filter: drop-shadow(0 5px 10px rgba(212, 175, 55, 0.5)); }

        .modal-image-container { width: 45%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(255,255,255,0.03), transparent); border-right: 1px solid #222; position: relative; perspective: 1500px; }
        .modal-dvd-case { width: 280px; height: 400px; position: relative; transform-style: preserve-3d; animation: modalFloat 7s ease-in-out infinite; filter: drop-shadow(-30px 40px 30px rgba(0,0,0,0.9)); }
        @keyframes modalFloat { 0% { transform: translateY(0px) rotateY(-15deg) rotateX(5deg); } 50% { transform: translateY(-20px) rotateY(10deg) rotateX(-5deg); } 100% { transform: translateY(0px) rotateY(-15deg) rotateX(5deg); } }
        .dvd-face { position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 4px 10px 10px 4px; }
        .dvd-front { transform: translateZ(calc(var(--modal-dvd-depth) / 2)); background: #000; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); box-shadow: inset 3px 0 10px rgba(255,255,255,0.2); }
        .dvd-front img { width: 100%; height: 100%; object-fit: cover; }
        .dvd-front::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(125deg, transparent 30%, rgba(255,255,255,0.2) 45%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.1) 55%, transparent 70%); mix-blend-mode: screen; pointer-events: none; }
        .dvd-side { width: var(--modal-dvd-depth); height: 100%; transform: rotateY(-90deg) translateZ(calc(var(--modal-dvd-depth) / 2)); background-color: #111; border: 1px solid rgba(255,255,255,0.15); box-shadow: inset -15px 0 30px rgba(0,0,0,1); }
        
        .modal-info { width: 55%; padding: 50px 40px 50px 50px; display: flex; flex-direction: column; justify-content: flex-start; position: relative; overflow-y: auto; overflow-x: hidden;}
        .modal-info::-webkit-scrollbar { width: 8px; }
        .modal-info::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; margin: 20px 0; }
        .modal-info::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        .anim-text { opacity: 0; transform: translateY(20px); transition: all 0.5s ease; }
        .modal-overlay.active .anim-text { opacity: 1; transform: translateY(0); }
        .modal-overlay.active .delay-1 { transition-delay: 0.1s; }
        .modal-overlay.active .delay-2 { transition-delay: 0.2s; }
        .modal-overlay.active .delay-3 { transition-delay: 0.3s; }
        .modal-overlay.active .delay-4 { transition-delay: 0.4s; }
        .modal-overlay.active .delay-5 { transition-delay: 0.5s; }

        .modal-title-display { font-family: 'Cinzel', serif; font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 700; color: #fff; margin-bottom: 25px; text-shadow: 0 5px 10px rgba(0,0,0,0.8); border-bottom: 2px solid #333; padding-bottom: 15px; line-height: 1.2; margin-top: 10px;}
        .modal-score-title { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        .modal-score-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .modal-score-wrapper::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 150px; height: 150px; background: radial-gradient(circle, var(--gold-glow), transparent 70%); z-index: -1; animation: pulseGlow 4s infinite; }
        .modal-score-value { font-family: 'Cinzel', serif; font-size: clamp(4rem, 8vw, 6rem); color: var(--gold); line-height: 1; text-shadow: 0 10px 30px rgba(0,0,0,0.9); display: inline-block; }
        .modal-platform { display: inline-block; background: #222; border: 1px solid var(--gold); color: var(--gold); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px;}
        .modal-date { font-size: 1.1rem; color: #ccc; margin-bottom: 20px; font-weight: bold; }
        .modal-desc { font-size: 1.1rem; line-height: 1.6; color: #bbb; border-left: 3px solid var(--gold); padding-left: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 30px;}

        /* Gallery de Prints */
        .print-wrapper { display: none; margin-top: 10px; }
        .print-wrapper h3 { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold;}
        .prints-gallery { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; margin-top: 10px; }
        .prints-gallery::-webkit-scrollbar { height: 6px; }
        .prints-gallery::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
        .print-thumbnail { width: 160px; height: 90px; object-fit: cover; border: 2px solid #444; border-radius: 6px; cursor: pointer; transition: 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.5); flex-shrink: 0; }
        .print-thumbnail:hover { border-color: var(--gold); transform: scale(1.05); box-shadow: 0 8px 20px rgba(212,175,55,0.4); }

        .lightbox-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(10px); }
        .lightbox-overlay.active { opacity: 1; pointer-events: all; }
        .lightbox-content { position: relative; max-width: 90%; max-height: 90%; }
        .lightbox-content img { max-width: 100%; max-height: 90vh; border: 2px solid var(--gold); border-radius: 8px; box-shadow: 0 0 40px rgba(212,175,55,0.3); transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .lightbox-overlay.active img { transform: scale(1); }

<script>
    const SUPABASE_URL = 'https://hqtctbvrtipperfbkxfd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9KqLVuA2pGACwtOlbmw9ug_ATvduPkE';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let games = [];
    let displayGames = []; 
    let isAdmin = false; 
    let deleteMode = false;
    let editTargetId = null; 
    
    let ledState = { isOn: true, color: '#00e5ff' };
    try {
        const savedLed = localStorage.getItem('nerisLedState');
        if (savedLed) ledState = JSON.parse(savedLed);
    } catch(e) {}

    async function initApp() {
        try {
            let { data, error } = await db.from('games').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            games = data || [];
            displayGames = [...games];
            document.getElementById('app-status').style.display = 'none';
            document.getElementById('library').style.display = 'flex';
            renderLibrary();
        } catch (err) {
            document.getElementById('app-status').innerText = "⚠️ Erro de conexão com o servidor.";
            document.getElementById('library').style.display = 'flex';
        }
    }
    
    function handleSort() {
        const sortType = document.getElementById('sort-select').value;
        if (sortType === 'recent') displayGames = [...games];
        else if (sortType === 'score') displayGames.sort((a, b) => parseFloat(b.score) - parseFloat(a.score));
        else if (sortType === 'az') displayGames.sort((a, b) => a.title.localeCompare(b.title));
        renderLibrary();
    }

    function calculateShelfCapacity() {
        const w = window.innerWidth;
        if (w > 1300) return 6;
        if (w > 1050) return 5;
        if (w > 850) return 4;
        return 3; 
    }

    function renderLibrary() {
        const library = document.getElementById('library');
        library.innerHTML = ''; 
        let shelfRow, shelfContent;
        const capacity = calculateShelfCapacity();

        displayGames.forEach((game, index) => {
            if (index % capacity === 0) {
                shelfRow = document.createElement('div'); shelfRow.className = 'shelf-row';
                shelfContent = document.createElement('div'); shelfContent.className = 'shelf-content';
                shelfRow.appendChild(shelfContent); library.appendChild(shelfRow);
            }

            const wrapper = document.createElement('div'); wrapper.className = 'game-case-wrapper';
            if (parseFloat(game.score) === 10) wrapper.classList.add('masterpiece');

            const shadow = document.createElement('div'); shadow.className = 'case-shadow'; wrapper.appendChild(shadow);
            const badge = document.createElement('div'); badge.className = 'platform-badge'; badge.innerText = game.platform || "PC";
            wrapper.appendChild(badge);

            const actionBtns = document.createElement('div'); actionBtns.className = 'action-btns';
            const editBtn = document.createElement('button'); editBtn.className = 'action-btn edit-btn'; editBtn.innerHTML = '✏️';
            editBtn.onclick = (e) => { e.stopPropagation(); startEditGame(game); };
            const delBtn = document.createElement('button'); delBtn.className = 'action-btn delete-btn'; delBtn.innerText = 'X';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteGame(game.id); };
            actionBtns.appendChild(editBtn); actionBtns.appendChild(delBtn);
            if(isAdmin && deleteMode) actionBtns.style.display = 'flex';

            wrapper.onclick = () => { if(!deleteMode) openModal(game); };

            const animator = document.createElement('div'); animator.className = 'game-case-animator';
            const gameCase = document.createElement('div'); gameCase.className = 'game-case';
            const front = document.createElement('div'); front.className = 'case-face case-front';
            const img = document.createElement('img'); img.src = game.cover; front.appendChild(img);
            const side = document.createElement('div'); side.className = 'case-face case-side';
            side.style.backgroundImage = `url(${game.cover})`; side.style.backgroundSize = 'cover'; side.style.backgroundPosition = 'left center'; 
            const top = document.createElement('div'); top.className = 'case-face case-top';

            const reflection = document.createElement('div'); reflection.className = 'game-reflection';
            const refImg = document.createElement('img'); refImg.src = game.cover; reflection.appendChild(refImg);

            if (parseFloat(game.score) === 10) {
                for(let i=0; i<3; i++) {
                    const spark = document.createElement('div'); spark.className = 'sparkle';
                    spark.style.left = `${Math.random() * 80 + 10}%`; spark.style.animationDelay = `${Math.random() * 2}s`;
                    animator.appendChild(spark);
                }
            }

            gameCase.appendChild(front); gameCase.appendChild(side); gameCase.appendChild(top); gameCase.appendChild(reflection); 
            animator.appendChild(gameCase); wrapper.appendChild(animator); wrapper.appendChild(actionBtns); shelfContent.appendChild(wrapper);
        });
        
    }

    const modal = document.getElementById('modal');
    function openModal(game) {
        document.getElementById('m-img').src = game.cover;
        const modalSide = document.getElementById('m-side');
        modalSide.style.backgroundImage = `url(${game.cover})`; modalSide.style.backgroundSize = 'cover'; modalSide.style.backgroundPosition = 'left center';
        
        document.getElementById('m-title-display').innerText = game.title;
        document.getElementById('m-platform').innerText = game.platform || "PC";
        document.getElementById('m-score').innerText = game.score;
        document.getElementById('m-date').innerText = game.date;
        document.getElementById('m-desc').innerText = game.review ? `"${game.review}"` : '';

        const printWrapper = document.getElementById('m-print-wrapper');
        const printGallery = document.getElementById('m-prints-gallery');
        printGallery.innerHTML = '';

        if (game.print && game.print.trim() !== "") {
            const links = game.print.split(',').map(l => l.trim()).filter(l => l);
            if (links.length > 0) {
                links.forEach(link => {
                    const img = document.createElement('img');
                    img.className = 'print-thumbnail'; img.src = link;
                    img.onclick = () => openLightbox(link);
                    printGallery.appendChild(img);
                });
                printWrapper.style.display = 'block';
            } else {
                printWrapper.style.display = 'none';
            }
        } else {
            printWrapper.style.display = 'none';
        }

        const seal = document.getElementById('m-seal');
        if (parseFloat(game.score) === 10) { modal.classList.add('modal-masterpiece'); } else { modal.classList.remove('modal-masterpiece'); }
        
        document.getElementById('m-info-scroll').scrollTop = 0;
        modal.classList.add('active');
    }
    
    function closeModal() { modal.classList.remove('active'); }
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    function openLightbox(src) {
        if(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox').classList.add('active'); }
    }
    function closeLightbox(event) {
        if(event.target.id === 'lightbox' || event.target.className === 'lightbox-close') { document.getElementById('lightbox').classList.remove('active'); }
    }

    let adminClicks = 0;
    document.getElementById('main-title').addEventListener('click', () => {
        adminClicks++;
        if(adminClicks === 3) {
            adminClicks = 0; const pwd = prompt("Acesso Restrito:");
            if(pwd === "nerisadmin") { isAdmin = true; document.getElementById('admin-panel').style.display = 'block'; renderLibrary(); }
        }
        setTimeout(() => adminClicks = 0, 2000);
    });

    function toggleAddForm() {
        const form = document.getElementById('add-form'); 
        form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
        if(form.style.display === 'flex') {
            document.getElementById('btn-save-game').innerText = "Salvar na Nuvem"; editTargetId = null;
            document.getElementById('i-title').value = ''; document.getElementById('i-cover').value = ''; document.getElementById('i-score').value = ''; document.getElementById('i-date').value = ''; document.getElementById('i-desc').value = ''; document.getElementById('i-print').value = '';
        }
    }
    function toggleDeleteMode() {
        deleteMode = !deleteMode; const btn = document.getElementById('del-mode-btn');
        btn.innerText = deleteMode ? "Concluir Edição" : "Habilitar Edição";
        btn.style.background = deleteMode ? "#e63946" : "var(--gold)"; btn.style.color = deleteMode ? "#fff" : "#000";
        renderLibrary();
    }

    function startEditGame(game) {
        editTargetId = game.id; 
        document.getElementById('i-title').value = game.title; document.getElementById('i-cover').value = game.cover; document.getElementById('i-platform').value = game.platform; document.getElementById('i-score').value = game.score; document.getElementById('i-date').value = game.date; document.getElementById('i-desc').value = game.review || ''; document.getElementById('i-print').value = game.print || '';
        document.getElementById('add-form').style.display = 'flex'; document.getElementById('btn-save-game').innerText = "💾 Atualizar Banco";
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    async function saveNewGame() {
        const title = document.getElementById('i-title').value; const cover = document.getElementById('i-cover').value;
        const platform = document.getElementById('i-platform').value; const score = document.getElementById('i-score').value;
        const date = document.getElementById('i-date').value; const review = document.getElementById('i-desc').value;
        const print = document.getElementById('i-print').value;

        if(!title || !cover) return;

        const btn = document.getElementById('btn-save-game');
        btn.innerText = "Processando..."; btn.disabled = true;

        try {
            if (editTargetId) {
                const { error } = await db.from('games').update({ title, cover, platform, score, date, review, print }).eq('id', editTargetId);
                if(error) throw error;
            } else {
                const { error } = await db.from('games').insert([{ title, cover, platform, score, date, review, print }]);
                if(error) throw error;
            }
            document.getElementById('add-form').style.display = 'none'; editTargetId = null;
            await initApp(); 
        } catch (err) { alert("Erro de transação."); }
        btn.innerText = "Salvar na Nuvem"; btn.disabled = false;
    }

    async function deleteGame(id) {
        if(confirm("Confirmar exclusão permanente?")) {
            try { await db.from('games').delete().eq('id', id); await initApp(); } catch(e) { alert("Erro na exclusão."); }
        }
    }

    function logoutAdmin() { isAdmin = false; deleteMode = false; document.getElementById('admin-panel').style.display = 'none'; renderLibrary(); }

    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowBlur = 4; ctx.shadowColor = '#d4af37';

    const getPos = (e) => { const rect = canvas.getBoundingClientRect(); return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top }; };
    
    const startDraw = (e) => { isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); };
    const drawing = (e) => { if (isDrawing) { e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }};
    const endDraw = () => isDrawing = false;

    canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', drawing); canvas.addEventListener('mouseup', endDraw); canvas.addEventListener('mouseout', endDraw);
    canvas.addEventListener('touchstart', startDraw, {passive: false}); canvas.addEventListener('touchmove', drawing, {passive: false}); canvas.addEventListener('touchend', endDraw);

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function openMural() { document.getElementById('mural-modal').classList.add('active'); loadSignatures(); }
    function closeMural() { document.getElementById('mural-modal').classList.remove('active'); clearCanvas(); }

    async function loadSignatures() {
        const grid = document.getElementById('sig-grid');
        grid.innerHTML = '<p style="color: #666; width: 100%; text-align: center; margin-top: 50px;">Acessando servidor...</p>';
        try {
            let { data, error } = await db.from('signatures').select('*').order('created_at', { ascending: false }).limit(40);
            if(error) throw error;
            grid.innerHTML = '';
            if(data && data.length > 0) {
                data.forEach(sig => {
                    const div = document.createElement('div'); div.className = 'sig-item';
                    const img = document.createElement('img'); img.src = sig.image_data;
                    div.appendChild(img); 
                    
                    if(isAdmin) {
                        const delBtn = document.createElement('button');
                        delBtn.className = 'sig-delete-btn';
                        delBtn.innerText = 'X';
                        delBtn.onclick = () => deleteSignature(sig.id);
                        div.appendChild(delBtn);
                    }
                    
                    grid.appendChild(div);
                });
            } else {
                grid.innerHTML = '<p style="color: #666; width: 100%; text-align: center; margin-top: 50px;">Mural vazio.</p>';
            }
        } catch(e) { grid.innerHTML = '<p style="color: #e63946; width: 100%; text-align: center; margin-top: 50px;">Falha ao carregar mural.</p>'; }
    }

    async function deleteSignature(id) {
        if(confirm("Apagar esta assinatura do mural?")) {
            try {
                await db.from('signatures').delete().eq('id', id);
                loadSignatures();
            } catch(e) {
                alert("Erro ao excluir assinatura.");
            }
        }
    }

    async function saveSignature() {
        let sigCount = parseInt(localStorage.getItem('mural_sig_count') || '0');
        if (sigCount >= 2 && !isAdmin) {
            alert("Você já deixou 2 assinaturas no mural! Vamos dar espaço para a comunidade.");
            return;
        }

        const btn = document.getElementById('btn-save-sig');
        const blank = document.createElement('canvas'); blank.width = canvas.width; blank.height = canvas.height;
        if(canvas.toDataURL() === blank.toDataURL()) return;

        btn.innerText = "Enviando..."; btn.disabled = true;
        const imageData = canvas.toDataURL('image/png');

        try {
            const { error } = await db.from('signatures').insert([{ image_data: imageData }]);
            if(error) throw error;
            
            if(!isAdmin) {
                sigCount++;
                localStorage.setItem('mural_sig_count', sigCount.toString());
            }
            
            clearCanvas(); loadSignatures();
        } catch(err) { alert("Falha na gravação."); }
        btn.innerText = "Salvar Marca"; btn.disabled = false;
    }

    window.addEventListener('resize', renderLibrary); 
    initApp();
</script>

</body>
</html>
